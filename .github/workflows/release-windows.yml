name: Release Windows

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Compilar, firmar y verificar
        run: npm run release:windows
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Crear release y publicar artefactos
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes
          Get-ChildItem dist -File | Where-Object { $_.Name -match '^Dashboard Uso APIs-.+\.(exe|txt)$' } | ForEach-Object {
            gh release upload $env:GITHUB_REF_NAME $_.FullName
          }
