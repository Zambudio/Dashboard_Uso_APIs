version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      next-react:
        patterns: [next, react, react-dom, eslint-config-next]
      electron:
        patterns: [electron, electron-builder, electron-store]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
