services:
  dashboard-ia:
    build:
      context: .
      dockerfile: Dockerfile
    image: dashboard-uso-apis:latest
    container_name: dashboard-uso-apis
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DASHBOARD_ENV_FILE=/app/.data/.env
      # Autenticación obligatoria (ver Docs/DOCKER.md). Definir en el .env junto
      # a este fichero; compose no arranca si falta el token.
      - DASHBOARD_REQUIRE_AUTH=1
      - DASHBOARD_AUTH_TOKEN=${DASHBOARD_AUTH_TOKEN:?Define DASHBOARD_AUTH_TOKEN en el .env junto a docker-compose.yml (openssl rand -hex 32)}
      - DASHBOARD_AUTH_USER=${DASHBOARD_AUTH_USER:-admin}
    volumes:
      # Persistencia de configuraciones, credenciales y caché sincronizada
      - dashboard-data:/app/.data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dashboard-data:
    name: dashboard-uso-apis-data
